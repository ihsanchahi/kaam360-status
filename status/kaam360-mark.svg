<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kaam360">
  <defs>
    <linearGradient id="k360-bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D6BF8"/>
      <stop offset="0.55" stop-color="#5B3FE0"/>
      <stop offset="1" stop-color="#8B3FE0"/>
    </linearGradient>
    <radialGradient id="k360-glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k360-dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- app tile -->
  <rect width="64" height="64" rx="16" fill="url(#k360-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#k360-glow)"/>
  <!-- the 360: a full turn, with the marker where the work comes round again -->
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#fff" stroke-opacity="0.95" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="110.5 12" transform="rotate(-50 32 32)"/>
  <circle cx="33.8" cy="12.6" r="4" fill="url(#k360-dot)" stroke="#fff" stroke-width="1.6"/>
  <!-- the K of Kaam -->
  <g fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26.5 22.5V41.5"/>
    <path d="M27.5 32.2 37.8 22.5"/>
    <path d="M31.8 30.6 38.2 41.5"/>
  </g>
</svg>
